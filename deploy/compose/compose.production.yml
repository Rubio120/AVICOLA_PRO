name: avicola-pro

x-backend-environment: &backend-environment
  AVICOLA_DATABASE_URL_FILE: /run/secrets/database_url
  AVICOLA_SESSION_HMAC_KEY_FILE: /run/secrets/session_hmac_key
  AVICOLA_ENVIRONMENT: production
  AVICOLA_LOG_FORMAT: json
  AVICOLA_SESSION_COOKIE_SECURE: "true"
  AVICOLA_CORS_ORIGINS: '["https://${APP_DOMAIN}"]'

services:
  db:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the external environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the external environment file}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  migrate:
    image: ${BACKEND_IMAGE_REF:?Set immutable backend image reference}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    secrets:
      - database_url
      - session_hmac_key
    networks:
      - application
      - data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    image: ${BACKEND_IMAGE_REF:?Set immutable backend image reference}
    environment: *backend-environment
    secrets:
      - database_url
      - session_hmac_key
    networks:
      - application
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  frontend:
    image: ${FRONTEND_IMAGE_REF:?Set immutable frontend image reference}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    networks:
      - edge
      - application
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to a real DNS name before starting}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

secrets:
  postgres_password:
    file: ../../secrets/postgres_password
  database_url:
    file: ../../secrets/database_url
  session_hmac_key:
    file: ../../secrets/session_hmac_key

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  application:
  data:
    internal: true
