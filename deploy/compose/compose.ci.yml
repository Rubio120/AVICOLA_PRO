services:
  db:
    image: postgres:16.15-trixie
    restart: "no"

  migrate:
    image: avicola-pro-backend:ci

  backend:
    image: avicola-pro-backend:ci
    environment:
      AVICOLA_ENVIRONMENT: test
      AVICOLA_SESSION_COOKIE_SECURE: "false"
    restart: "no"

  frontend:
    image: avicola-pro-frontend:ci
    restart: "no"

  restore-db:
    image: postgres:16.15-trixie
    restart: "no"
    environment:
      POSTGRES_DB: ${RESTORE_TARGET_DATABASE_NAME:-avicola_restore_ci}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the external environment file}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - restore_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  restore_data:
